<!DOCTYPE html>
خ<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود اپلیکیشن</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 45px 35px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #00c9a7, #00a8e8);
            color: #fff;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 200, 167, 0.35);
        }
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 200, 167, 0.55);
        }
        .download-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">📱</div>
        <h1>دانلود اپلیکیشن</h1>
        <p>برای نصب اپلیکیشن روی دکمه زیر کلیک کنید</p>
        <a href="bo.apk" class="download-btn" download>
            ⬇ دانلود APK
        </a>
    </div>

</body>
</html>
